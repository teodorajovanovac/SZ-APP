name: szapp

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: backend/src/SzApp.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__SzApp: Server=sqlserver,1433;Database=${MSSQL_DATABASE:-SzApp};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True
      Database__ApplyMigrations: "true"
      Platform__Storage__RootPath: ${SZAPP_DOCUMENTS_PATH:-/data/documents}
      Etl__Storage__RootPath: ${SZAPP_IMPORT_PATH:-/data/imports}
      Reports__ReadOnlyConnectionString: ${SZAPP_REPORTS_CONNECTION_STRING:-}
      BootstrapAdmin__Email: ${BootstrapAdmin__Email:-}
      BootstrapAdmin__Password: ${BootstrapAdmin__Password:-}
      BootstrapDemoData: ${BootstrapDemoData:-false}
      Security__RequireHttps: ${SZAPP_REQUIRE_HTTPS:-false}
      Authentication__CookieName: ${SZAPP_COOKIE_NAME:-szapp.session}
    ports:
      - "8081:8080"
    volumes:
      - documents:/data/documents
      - imports:/data/imports
      - reports:/data/reports
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health/ready > /dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: backend/src/SzApp.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__SzApp: Server=sqlserver,1433;Database=${MSSQL_DATABASE:-SzApp};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True
      ASPNETCORE_URLS: http://+:8080
      Platform__Storage__RootPath: ${SZAPP_DOCUMENTS_PATH:-/data/documents}
      Etl__Storage__RootPath: ${SZAPP_IMPORT_PATH:-/data/imports}
      Email__From: ${Email__From:-}
      Email__Smtp__Host: ${Email__Smtp__Host:-}
      Email__Smtp__Port: ${Email__Smtp__Port:-587}
      Email__Smtp__UseTls: ${Email__Smtp__UseTls:-true}
      Email__Smtp__Username: ${Email__Smtp__Username:-}
      Email__Smtp__Password: ${Email__Smtp__Password:-}
    volumes:
      - documents:/data/documents
      - imports:/data/imports
      - reports:/data/reports
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8080/health/ready > /dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  web:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  sql-data:
  documents:
  imports:
  reports:
