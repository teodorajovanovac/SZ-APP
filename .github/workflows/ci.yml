name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore backend/SzApp.slnx
      - run: dotnet build backend/SzApp.slnx --configuration Release --no-restore
        env:
          ConnectionStrings__SzApp: Server=localhost;Database=OpenApiOnly;User Id=sa;Password=OpenApi_only_123!;TrustServerCertificate=True
      - run: dotnet test backend/SzApp.slnx --configuration Release --no-build
      - run: dotnet format backend/SzApp.slnx --verify-no-changes --no-restore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run api:generate
        working-directory: frontend
      - run: git diff --exit-code -- backend/src/SzApp.Api/openapi frontend/src/api/generated/openapi
      - run: npm test -- --run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run e2e
        working-directory: frontend
